name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$ECR_REPOSITORY:${{ github.sha }}" -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REPOSITORY:latest"

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          PILASLOT_DB_URL: ${{ vars.PILASLOT_DB_URL }}
          PILASLOT_DB_USERNAME: ${{ vars.PILASLOT_DB_USERNAME }}
          DOMAIN: ${{ vars.DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          : "${DOMAIN:?DOMAIN repository variable is required}"
          : "${API_DOMAIN:?API_DOMAIN repository variable is required}"
          ECR_REGISTRY="${ECR_REPOSITORY%%/*}"
          COMPOSE_B64=$(base64 -w0 compose.prod.yml)
          CADDYFILE_B64=$(base64 -w0 Caddyfile)

          SCRIPT=$(cat <<EOF
          set -eu
          umask 077
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          mkdir -p /opt/pilaslot
          echo '$COMPOSE_B64' | base64 -d > /opt/pilaslot/compose.prod.yml
          echo '$CADDYFILE_B64' | base64 -d > /opt/pilaslot/Caddyfile
          DB_PASSWORD=\$(aws ssm get-parameter --name /pilaslot/db-password --with-decryption --region $AWS_REGION --query Parameter.Value --output text)
          JWT_SECRET=\$(aws ssm get-parameter --name /pilaslot/jwt-secret --with-decryption --region $AWS_REGION --query Parameter.Value --output text)
          DB_PASSWORD=\${DB_PASSWORD//\\\$/\\\$\\\$}
          JWT_SECRET=\${JWT_SECRET//\\\$/\\\$\\\$}
          cat > /opt/pilaslot/.env <<ENVEOF
          ECR_REPOSITORY=$ECR_REPOSITORY
          IMAGE_TAG=$IMAGE_TAG
          DOMAIN=$DOMAIN
          API_DOMAIN=$API_DOMAIN
          PILASLOT_DB_URL=$PILASLOT_DB_URL
          PILASLOT_DB_USERNAME=$PILASLOT_DB_USERNAME
          PILASLOT_DB_PASSWORD=\$DB_PASSWORD
          PILASLOT_JWT_SECRET=\$JWT_SECRET
          ENVEOF
          chmod 600 /opt/pilaslot/.env
          cd /opt/pilaslot
          docker compose --env-file .env -f compose.prod.yml config --quiet
          docker compose --env-file .env -f compose.prod.yml pull
          LABEL=\$(docker inspect -f "{{index .Config.Labels \"com.docker.compose.project\"}}" pilaslot-app 2>/dev/null || true)
          if [ -z "\$LABEL" ]; then
            docker rm -f pilaslot-app 2>/dev/null || true
          fi
          docker compose --env-file .env -f compose.prod.yml up -d
          for i in \$(seq 1 15); do
            if curl -fs --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/actuator/health" | grep -q '"status":"UP"'; then
              echo "Health check passed"
              docker image prune -af
              exit 0
            fi
            sleep 4
          done
          echo "Health check failed after retries"
          exit 1
          EOF
          )

          COMMANDS_JSON=$(printf '%s' "$SCRIPT" | jq -Rs 'split("\n") | map(select(length > 0))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy pilaslot-app $IMAGE_TAG" \
            --parameters "{\"commands\":$COMMANDS_JSON}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          WAIT_STATUS=0
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" || WAIT_STATUS=$?

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          if [ "$WAIT_STATUS" -ne 0 ]; then
            echo "SSM command did not complete successfully (wait exit code $WAIT_STATUS)"
            exit 1
          fi
