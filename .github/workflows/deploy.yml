name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$ECR_REPOSITORY:${{ github.sha }}" -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REPOSITORY:latest"

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          PILASLOT_DB_URL: ${{ vars.PILASLOT_DB_URL }}
          PILASLOT_DB_USERNAME: ${{ vars.PILASLOT_DB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY%%/*}"

          SCRIPT=$(cat <<EOF
          set -eu
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker pull $ECR_REPOSITORY:$IMAGE_TAG
          DB_PASSWORD=\$(aws ssm get-parameter --name /pilaslot/db-password --with-decryption --region $AWS_REGION --query Parameter.Value --output text)
          JWT_SECRET=\$(aws ssm get-parameter --name /pilaslot/jwt-secret --with-decryption --region $AWS_REGION --query Parameter.Value --output text)
          docker rm -f pilaslot-app || true
          docker run -d --name pilaslot-app --restart unless-stopped -p 8081:8081 -e SPRING_PROFILES_ACTIVE=prod -e PILASLOT_DB_URL='$PILASLOT_DB_URL' -e PILASLOT_DB_USERNAME='$PILASLOT_DB_USERNAME' -e PILASLOT_DB_PASSWORD="\$DB_PASSWORD" -e PILASLOT_JWT_SECRET="\$JWT_SECRET" $ECR_REPOSITORY:$IMAGE_TAG
          for i in \$(seq 1 10); do
            if curl -fs http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "Health check passed"
              docker image prune -af
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after retries"
          exit 1
          EOF
          )

          COMMANDS_JSON=$(printf '%s' "$SCRIPT" | jq -Rs 'split("\n") | map(select(length > 0))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy pilaslot-app $IMAGE_TAG" \
            --parameters "{\"commands\":$COMMANDS_JSON}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
