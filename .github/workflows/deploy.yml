name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$ECR_REPOSITORY:${{ github.sha }}" -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REPOSITORY:latest"

      - name: Deploy to EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          PILASLOT_DB_URL: ${{ vars.PILASLOT_DB_URL }}
          PILASLOT_DB_USERNAME: ${{ vars.PILASLOT_DB_USERNAME }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          : "${API_DOMAIN:?API_DOMAIN repository variable is required}"
          ECR_REGISTRY="${ECR_REPOSITORY%%/*}"
          COMPOSE_B64=$(base64 -w0 compose.prod.yml)
          CADDYFILE_B64=$(base64 -w0 Caddyfile)

          SCRIPT=$(cat <<EOF
          set -eu
          umask 077
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          mkdir -p /opt/pilaslot
          echo '$COMPOSE_B64' | base64 -d > /opt/pilaslot/compose.prod.yml
          echo '$CADDYFILE_B64' | base64 -d > /opt/pilaslot/Caddyfile.template
          DB_PASSWORD=\$(aws ssm get-parameter --name /pilaslot/db-password --with-decryption --region $AWS_REGION --query Parameter.Value --output text)
          JWT_SECRET=\$(aws ssm get-parameter --name /pilaslot/jwt-secret --with-decryption --region $AWS_REGION --query Parameter.Value --output text)
          DB_PASSWORD=\${DB_PASSWORD//\\\$/\\\$\\\$}
          JWT_SECRET=\${JWT_SECRET//\\\$/\\\$\\\$}
          cat > /opt/pilaslot/.env <<ENVEOF
          ECR_REPOSITORY=$ECR_REPOSITORY
          IMAGE_TAG=$IMAGE_TAG
          API_DOMAIN=$API_DOMAIN
          PILASLOT_DB_URL=$PILASLOT_DB_URL
          PILASLOT_DB_USERNAME=$PILASLOT_DB_USERNAME
          PILASLOT_DB_PASSWORD=\$DB_PASSWORD
          PILASLOT_JWT_SECRET=\$JWT_SECRET
          ENVEOF
          chmod 600 /opt/pilaslot/.env
          cd /opt/pilaslot
          docker compose --env-file .env -f compose.prod.yml config --quiet

          ACTIVE_COLOR=\$(cat active_color 2>/dev/null || echo blue)
          if [ "\$ACTIVE_COLOR" = "blue" ]; then
            NEW_COLOR=green
            NEW_PORT=8082
          else
            NEW_COLOR=blue
            NEW_PORT=8081
          fi
          echo "active=\$ACTIVE_COLOR new=\$NEW_COLOR port=\$NEW_PORT"

          docker compose --env-file .env -f compose.prod.yml pull "app-\$NEW_COLOR"
          docker compose --env-file .env -f compose.prod.yml up -d "app-\$NEW_COLOR"

          NEW_HEALTHY=0
          for i in \$(seq 1 15); do
            if curl -fs "http://127.0.0.1:\$NEW_PORT/actuator/health" | grep -q '"status":"UP"'; then
              NEW_HEALTHY=1
              break
            fi
            sleep 4
          done

          if [ "\$NEW_HEALTHY" -ne 1 ]; then
            echo "새 컨테이너(\$NEW_COLOR) 헬스체크 실패, 트래픽 전환하지 않고 롤백"
            docker rm -f "pilaslot-app-\$NEW_COLOR" 2>/dev/null || true
            exit 1
          fi

          cp Caddyfile Caddyfile.previous 2>/dev/null || true
          sed "s#__APP_UPSTREAM__#app-\$NEW_COLOR:8081#" Caddyfile.template > Caddyfile

          CADDY_RUNNING=\$(docker inspect -f '{{.State.Running}}' pilaslot-caddy 2>/dev/null || echo false)
          if [ "\$CADDY_RUNNING" = "true" ]; then
            if ! docker exec pilaslot-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo "Caddy reload 자체가 실패, 이전 설정으로 즉시 복원 시도"
              if [ -f Caddyfile.previous ]; then
                cp Caddyfile.previous Caddyfile
                docker exec pilaslot-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || true
              fi
              docker rm -f "pilaslot-app-\$NEW_COLOR" 2>/dev/null || true
              exit 1
            fi
          else
            docker compose --env-file .env -f compose.prod.yml up -d caddy
          fi

          CUTOVER_OK=0
          for i in \$(seq 1 15); do
            if curl -fs --resolve "$API_DOMAIN:443:127.0.0.1" "https://$API_DOMAIN/actuator/health" | grep -q '"status":"UP"'; then
              CUTOVER_OK=1
              break
            fi
            sleep 4
          done

          if [ "\$CUTOVER_OK" -ne 1 ]; then
            echo "전환 후 실제 도메인 헬스체크 실패, 이전 버전(\$ACTIVE_COLOR)으로 롤백 시도"
            ROLLBACK_OK=0
            CADDY_RUNNING=\$(docker inspect -f '{{.State.Running}}' pilaslot-caddy 2>/dev/null || echo false)
            if [ -f Caddyfile.previous ] && [ "\$CADDY_RUNNING" = "true" ]; then
              cp Caddyfile.previous Caddyfile
              if docker exec pilaslot-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
                for i in \$(seq 1 15); do
                  if curl -fs --resolve "$API_DOMAIN:443:127.0.0.1" "https://$API_DOMAIN/actuator/health" | grep -q '"status":"UP"'; then
                    ROLLBACK_OK=1
                    break
                  fi
                  sleep 4
                done
              fi
            fi

            if [ "\$ROLLBACK_OK" -eq 1 ]; then
              echo "이전 버전(\$ACTIVE_COLOR)으로 정상 롤백 확인, 신버전(\$NEW_COLOR) 컨테이너 정리"
              docker stop -t 30 "pilaslot-app-\$NEW_COLOR" 2>/dev/null || true
              docker rm -f "pilaslot-app-\$NEW_COLOR" 2>/dev/null || true
            else
              echo "롤백도 실패 — Caddy가 어느 버전을 보고 있는지 불확실하므로 신/구버전 컨테이너 모두 유지, 수동 확인 필요"
            fi
            exit 1
          fi

          echo "\$NEW_COLOR" > active_color
          docker stop -t 30 pilaslot-app 2>/dev/null || true
          docker rm -f pilaslot-app 2>/dev/null || true
          if [ "\$ACTIVE_COLOR" != "\$NEW_COLOR" ]; then
            docker stop -t 30 "pilaslot-app-\$ACTIVE_COLOR" 2>/dev/null || true
            docker rm -f "pilaslot-app-\$ACTIVE_COLOR" 2>/dev/null || true
          fi

          echo "Deploy succeeded (color=\$NEW_COLOR)"
          docker image prune -af
          EOF
          )

          COMMANDS_JSON=$(printf '%s' "$SCRIPT" | jq -Rs 'split("\n") | map(select(length > 0))')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy pilaslot-app $IMAGE_TAG" \
            --parameters "{\"commands\":$COMMANDS_JSON}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|Cancelling|TimedOut) break ;;
              *) sleep 5 ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed (status: $STATUS)"
            exit 1
          fi
