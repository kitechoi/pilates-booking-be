services:
  app:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG}
    container_name: pilaslot-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PILASLOT_DB_URL: ${PILASLOT_DB_URL}
      PILASLOT_DB_USERNAME: ${PILASLOT_DB_USERNAME}
      PILASLOT_DB_PASSWORD: ${PILASLOT_DB_PASSWORD}
      PILASLOT_JWT_SECRET: ${PILASLOT_JWT_SECRET}
    ports:
      - "127.0.0.1:8081:8081"

  caddy:
    image: caddy:2-alpine
    container_name: pilaslot-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
